<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessLearn in Savanna Fixture</title>
  <link rel="stylesheet" href="assets/css/application_alx.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .fixture-shell { max-width: 1180px; margin: 0 auto; padding: 1rem; }
    .fixture-banner { border: 2px solid #db3e3e; padding: 0.75rem; margin-bottom: 1rem; background: #fff; }
  </style>
</head>
<body class="notranslate" translate="no">
  <header class="navbar bg-white shadow-sm">
    <div class="container-fluid"><strong>ALX Savanna integration fixture</strong></div>
  </header>
  <main class="fixture-shell savanna-styles">
    <p class="fixture-banner">
      This is an isolated integration fixture built from the supplied global Savanna styles. It is not the missing Rails/React source application.
    </p>
    <article>
      <h1>Accessible lesson</h1>
      <div id="accesslearn-lesson"></div>
    </article>
  </main>
  <script>
    const parameters = new URLSearchParams(location.search);
    const apiBase = "https://localhost:7121";
    const lessonId = parameters.get("lesson");
    const script = document.createElement("script");
    script.src = `${apiBase.replace(/\/$/, "")}/sdk/v1/accesslearn-player.min.js`;
    script.defer = true;
    script.addEventListener("load", () => {
      if (!lessonId) {
        document.getElementById("accesslearn-lesson").textContent = "Add ?lesson=<published-lesson-id> to load the player.";
        return;
      }
      window.AccessLearn.mount("#accesslearn-lesson", {
        lessonId,
        apiBase,
        locale: parameters.get("locale") === "am" ? "am" : "en"
      });
    });
    document.head.append(script);
  </script>
</body>
</html>
